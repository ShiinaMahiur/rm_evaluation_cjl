# S1 识别（detector_traditional）参数参考
# 实际运行通过 ROS 参数传入，例如：
#   ros2 run rm_vision_probe detector_traditional --ros-args -p publish_hz:=30.0 -p v_thresh:=110
detector_traditional:
  ros__parameters:
    publish_hz: 30.0     # 检测结果发布频率 (Hz)
    debug_image: true    # 是否发布 /detector/debug_image
    max_armors: 8        # 每帧最多输出装甲板数
    v_thresh: 110        # HSV 的 V 门限（灯条为高亮 LED）
    s_thresh: 90         # HSV 的 S 门限
    min_aspect: 1.5      # 灯条高宽比下限
    gap_ratio: [0.6, 4.2]  # 两灯间距/灯高（放宽到 4.2 以覆盖大角度斜视）
    max_dw: 0.60         # 两灯宽度差/较宽者（配合 gap_ratio 防误配）
    max_dh: 0.35         # 两灯高度差/平均高
    max_dy: 0.55         # 两灯中心 y 差/平均高
    min_digit: 0.04      # 数字区像素比例下限
